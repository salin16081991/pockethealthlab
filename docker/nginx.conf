server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (TLS itself terminates at the reverse proxy in front)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self)" always;

    # PWA files must revalidate so updates reach installed apps.
    # "location = /" matters most: that is the URL everyone loads, and
    # without no-cache Safari serves a stale app after every deploy.
    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
