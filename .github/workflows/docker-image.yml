name: Build and publish Docker image

on:
  push:
    branches: [main]
    paths:
      - "prototypes/sphl-core-web/**"
      - "docker/**"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sphl-web:latest
            ghcr.io/${{ github.repository_owner }}/sphl-web:${{ github.sha }}
