<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SPHL">
<title>Sirony Pocket Health Lab</title>
<style>
  :root {
    --bg: #0b1220; --card: #121c30; --card2: #182642;
    --text: #e8eefb; --muted: #8fa3c8; --accent: #ff5d73; --breath: #4aa3ff;
    --good: #3ddc97; --warn: #ffc857; --bad: #ff5d73;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans", sans-serif;
    min-height: 100vh; max-width: 480px; margin: 0 auto; padding: 14px;
    display: flex; flex-direction: column;
  }
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header img { width: 34px; height: 34px; border-radius: 9px; }
  header h1 { font-size: 1rem; font-weight: 700; }
  header .langbtn {
    background: var(--card); color: var(--text); border: 1px solid #223252;
    border-radius: 20px; padding: 6px 12px; font-size: 0.85rem; cursor: pointer;
  }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .bigbtn {
    width: 100%; border: none; border-radius: 18px; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 800;
    font-size: 1.15rem; padding: 18px; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .bigbtn.secondary { background: #33415e; }
  .bigbtn.green { background: var(--good); color: #06281a; }
  .bigbtn.blue { background: var(--breath); }
  .bigbtn:active { transform: scale(0.98); }
  .stack { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-bottom: 8px; }
  .center { text-align: center; }
  .muted { color: var(--muted); }
  .step-title { font-size: 1.25rem; font-weight: 800; text-align: center; margin: 8px 0 4px; }
  .step-sub { color: var(--muted); text-align: center; font-size: 0.95rem; line-height: 1.5; }
  .langlist { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
  .langlist button {
    background: var(--card); border: 2px solid #223252; color: var(--text);
    border-radius: 18px; padding: 22px; font-size: 1.5rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  /* home tiles */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .tile {
    background: var(--card); border: 1px solid #223252; border-radius: 16px;
    padding: 16px 10px; text-align: center; cursor: pointer; font-family: inherit;
    color: var(--text); font-weight: 700; font-size: 0.9rem;
  }
  .tile .em { font-size: 2rem; display: block; margin-bottom: 6px; }
  .tile:active { transform: scale(0.96); }
  .tile.wide { grid-column: 1 / -1; }
  .tile.sos { background: rgba(255,93,115,0.15); border-color: var(--accent); color: var(--accent); }
  /* guide illus */
  .illus { display: flex; justify-content: center; margin: 12px 0; }
  .illus .em { font-size: 5.5rem; }
  @keyframes pressPulse { 0%,100% { transform: translate(0,0);} 50% { transform: translate(-14px,14px);} }
  #fingerGroup { animation: pressPulse 2.2s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
  #flashGlow { animation: glow 1.1s ease-in-out infinite; }
  @keyframes chestRise { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-7px);} }
  #chestPhone { animation: chestRise 4s ease-in-out infinite; }
  @keyframes airPuff { 0%,100% { opacity: 0.15;} 50% { opacity: 0.9;} }
  #airLines { animation: airPuff 4s ease-in-out infinite; }
  /* measuring */
  .ring-wrap { position: relative; width: 220px; height: 220px; margin: 6px auto; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-center .hr { font-size: 3rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .ring-center .unit { color: var(--muted); font-size: 0.8rem; text-align: center; padding: 0 30px; }
  .contact-pill {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    border-radius: 14px; padding: 12px; font-size: 1rem; font-weight: 700;
  }
  .contact-pill.ok { background: rgba(61,220,151,0.15); color: var(--good); }
  .contact-pill.no { background: rgba(255,93,115,0.15); color: var(--bad); }
  #wave { width: 100%; height: 64px; display: block; background: var(--card2); border-radius: 10px; margin-top: 10px; }
  /* result */
  .result-icon { display: flex; justify-content: center; margin: 4px 0; }
  .result-hr { font-size: 3.8rem; font-weight: 800; text-align: center; line-height: 1; font-variant-numeric: tabular-nums; }
  .result-unit { text-align: center; color: var(--muted); margin-bottom: 8px; }
  .result-msg { text-align: center; font-size: 1rem; line-height: 1.5; padding: 0 6px; }
  .mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .mini { background: var(--card2); border-radius: 12px; padding: 10px 12px; text-align: center; }
  .mini .v { font-size: 1.15rem; font-weight: 700; }
  .mini .k { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  #history .entry { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #223252; font-size: 0.88rem; }
  #history .entry:last-child { border-bottom: none; }
  #history .t { color: var(--muted); font-size: 0.72rem; }
  .badge { padding: 2px 10px; border-radius: 20px; font-weight: 600; font-size: 0.72rem; }
  .badge.good { background: rgba(61,220,151,0.15); color: var(--good); }
  .badge.warn { background: rgba(255,200,87,0.15); color: var(--warn); }
  .badge.bad  { background: rgba(255,93,115,0.15); color: var(--bad); }
  .disclaimer { font-size: 0.68rem; color: var(--muted); text-align: center; padding: 6px 4px; }
  #video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  /* reaction + taps */
  .bigarea {
    flex: 1; border-radius: 20px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; cursor: pointer;
    font-size: 1.5rem; font-weight: 800; margin-bottom: 12px; min-height: 300px;
    background: var(--card2); user-select: none; -webkit-user-select: none; text-align: center; padding: 20px;
  }
  .bigarea.waitState { background: #5a2430; }
  .bigarea.goState { background: #14532d; }
  .bigarea .big { font-size: 3rem; font-variant-numeric: tabular-nums; }
  /* photo */
  #photoVideo { width: 100%; border-radius: 16px; background: #000; max-height: 55vh; object-fit: cover; }
  .photo-overlay { position: relative; }
  .photo-guide {
    position: absolute; inset: 12%; border: 3px dashed rgba(255,255,255,0.6);
    border-radius: 16px; pointer-events: none;
  }
  .gallery { display: flex; gap: 8px; overflow-x: auto; padding: 6px 0; }
  .gallery img { height: 90px; border-radius: 10px; }
  .gallery .gitem { text-align: center; font-size: 0.65rem; color: var(--muted); }
  /* report */
  .rep-domain { margin-bottom: 4px; font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 10px; }
  .rep-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #223252; font-size: 0.92rem; }
  .rep-row:last-child { border-bottom: none; }
  input[type="time"] {
    background: var(--card2); color: var(--text); border: 1px solid #223252;
    border-radius: 12px; padding: 14px; font-size: 1.2rem; width: 100%; font-family: inherit;
  }
  label { font-size: 0.85rem; color: var(--muted); display: block; margin: 10px 0 6px; }
</style>
</head>
<body>

<!-- LANGUAGE -->
<section class="screen" id="scr-lang">
  <div class="center" style="margin-top:30px;">
    <img src="icons/icon-192.png" width="72" height="72" style="border-radius:18px;">
    <div class="step-title">Sirony Pocket Health Lab</div>
  </div>
  <div class="langlist">
    <button data-lang="en">English</button>
    <button data-lang="hi">हिन्दी</button>
  </div>
</section>

<!-- HOME -->
<section class="screen" id="scr-home">
  <header>
    <div class="brand"><img src="icons/icon-192.png" alt=""><h1>SPHL</h1></div>
    <button class="langbtn" id="langSwitch">🌐</button>
  </header>
  <div class="tiles" id="tiles"></div>
  <div class="card">
    <div style="font-size:0.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;" data-i18n="history_title"></div>
    <div id="baselineLine" class="muted" style="font-size:0.82rem;margin-bottom:6px;"></div>
    <div id="history"></div>
  </div>
  <div class="disclaimer" data-i18n="disclaimer"></div>
  <div class="disclaimer" id="verLine" style="opacity:0.7"></div>
</section>

<!-- GUIDE -->
<section class="screen" id="scr-guide">
  <div class="step-title" id="guideTitle"></div>
  <div class="illus" id="illusHeart">
    <svg width="240" height="220" viewBox="0 0 240 220" fill="none">
      <rect x="60" y="20" width="120" height="185" rx="18" fill="#182642" stroke="#33415e" stroke-width="3"/>
      <rect x="76" y="36" width="52" height="52" rx="12" fill="#0b1220"/>
      <circle cx="92" cy="52" r="8" fill="#223252" stroke="#33415e" stroke-width="2"/>
      <circle cx="112" cy="72" r="8" fill="#223252" stroke="#33415e" stroke-width="2"/>
      <circle id="flashGlow" cx="112" cy="52" r="7" fill="#ffc857"/>
      <g id="fingerGroup">
        <ellipse cx="124" cy="86" rx="30" ry="38" fill="#e8a87c" transform="rotate(-35 124 86)"/>
        <ellipse cx="120" cy="80" rx="18" ry="24" fill="#f2bd94" transform="rotate(-35 120 80)"/>
        <path d="M144 50 Q180 15 208 45 L164 112 Z" fill="#e8a87c"/>
      </g>
      <path d="M20 190 h55 l8 -14 10 26 9 -18 6 6 h112" stroke="#ff5d73" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="illus" id="illusBreath" style="display:none;">
    <svg width="260" height="200" viewBox="0 0 260 200" fill="none">
      <rect x="10" y="150" width="240" height="8" rx="4" fill="#223252"/>
      <circle cx="42" cy="122" r="22" fill="#e8a87c"/>
      <path d="M62 132 Q90 96 150 104 L235 116 Q246 120 244 132 L240 150 L64 150 Z" fill="#33415e"/>
      <g id="chestPhone">
        <rect x="102" y="72" width="34" height="58" rx="7" fill="#182642" stroke="#4aa3ff" stroke-width="3" transform="rotate(-8 119 101)"/>
        <circle cx="119" cy="118" r="4" fill="#4aa3ff" transform="rotate(-8 119 101)"/>
      </g>
      <g id="airLines" stroke="#4aa3ff" stroke-width="3" stroke-linecap="round">
        <path d="M30 92 q-6 -8 0 -16"/>
        <path d="M42 88 q-6 -10 0 -20"/>
      </g>
    </svg>
  </div>
  <div class="illus" id="illusEmoji" style="display:none;"><span class="em" id="illusEmojiChar">🤲</span></div>
  <div class="step-sub" id="guideText"></div>
  <div class="stack">
    <button class="bigbtn" id="startBtn">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
      <span data-i18n="start"></span>
    </button>
    <button class="bigbtn secondary" id="guideBack" data-i18n="back"></button>
  </div>
</section>

<!-- MEASURING (shared: heart / breath / motion / audio) -->
<section class="screen" id="scr-measure">
  <div class="step-title" id="measureTitle"></div>
  <div class="ring-wrap">
    <svg width="220" height="220">
      <circle cx="110" cy="110" r="95" stroke="#223252" stroke-width="13" fill="none"/>
      <circle id="ringProg" cx="110" cy="110" r="95" stroke="#ff5d73" stroke-width="13" fill="none"
              stroke-linecap="round" stroke-dasharray="597" stroke-dashoffset="597"/>
    </svg>
    <div class="ring-center">
      <div class="hr" id="hrLive">--</div>
      <div class="unit" id="unitLive"></div>
    </div>
  </div>
  <div class="contact-pill no" id="contactPill"><span id="contactText"></span></div>
  <canvas id="wave"></canvas>
  <div class="stack">
    <button class="bigbtn secondary" id="stopBtn" data-i18n="cancel"></button>
  </div>
</section>

<!-- RESULT -->
<section class="screen" id="scr-result">
  <div class="step-title" data-i18n="result_title"></div>
  <div class="card">
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-hr" id="rHr">--</div>
    <div class="result-unit" id="unitResult"></div>
    <div class="result-msg" id="rMsg"></div>
    <div class="mini-grid">
      <div class="mini"><div class="v" id="rExtra">--</div><div class="k" id="rExtraLabel"></div></div>
      <div class="mini"><div class="v" id="rQual">--</div><div class="k" data-i18n="quality"></div></div>
    </div>
    <div class="step-sub" id="rRange" style="margin-top:10px;"></div>
  </div>
  <div class="stack">
    <button class="bigbtn" id="againBtn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
      <span data-i18n="again"></span>
    </button>
    <button class="bigbtn green" id="doneBtn" data-i18n="done"></button>
  </div>
</section>

<!-- REACTION -->
<section class="screen" id="scr-react">
  <div class="step-title" data-i18n="react_name"></div>
  <div class="step-sub" id="reactRound"></div>
  <div class="bigarea" id="reactArea"><span id="reactText"></span><span class="big" id="reactMs"></span></div>
  <div class="stack"><button class="bigbtn secondary" id="reactCancel" data-i18n="cancel"></button></div>
</section>

<!-- TAPS -->
<section class="screen" id="scr-taps">
  <div class="step-title" data-i18n="taps_name"></div>
  <div class="step-sub" id="tapsInfo"></div>
  <div class="bigarea" id="tapsArea"><span id="tapsText"></span><span class="big" id="tapsCount"></span></div>
  <div class="stack"><button class="bigbtn secondary" id="tapsCancel" data-i18n="cancel"></button></div>
</section>

<!-- PHOTO -->
<section class="screen" id="scr-photo">
  <div class="step-title" id="photoTitle"></div>
  <div class="stack" id="photoTypes" style="margin-top:14px;">
    <button class="bigbtn blue" data-ptype="skin">🩹 <span data-i18n="photo_skin"></span></button>
    <button class="bigbtn blue" data-ptype="wound">🩸 <span data-i18n="photo_wound"></span></button>
    <button class="bigbtn blue" data-ptype="eye">👁️ <span data-i18n="photo_eye"></span></button>
    <button class="bigbtn secondary" id="photoBack1" data-i18n="back"></button>
  </div>
  <div id="photoCam" style="display:none;">
    <div class="photo-overlay">
      <video id="photoVideo" autoplay playsinline muted></video>
      <div class="photo-guide"></div>
    </div>
    <div class="step-sub" style="margin-top:8px;" data-i18n="photo_tip"></div>
    <div class="stack">
      <button class="bigbtn" id="photoSnap">📸 <span data-i18n="photo_take"></span></button>
      <button class="bigbtn secondary" id="photoBack2" data-i18n="back"></button>
    </div>
  </div>
</section>

<!-- GALLERY -->
<section class="screen" id="scr-gallery">
  <div class="step-title" data-i18n="gallery_title"></div>
  <div id="galleryList" style="flex:1; overflow-y:auto;"></div>
  <div class="stack"><button class="bigbtn secondary" id="galleryBack" data-i18n="back"></button></div>
</section>

<!-- SLEEP -->
<section class="screen" id="scr-sleep">
  <div class="step-title" data-i18n="sleep_name"></div>
  <div class="illus"><span class="em">😴</span></div>
  <div class="card">
    <label data-i18n="sleep_bed"></label>
    <input type="time" id="sleepBed" value="23:00">
    <label data-i18n="sleep_wake"></label>
    <input type="time" id="sleepWake" value="06:30">
  </div>
  <div class="stack">
    <button class="bigbtn" id="sleepSave" data-i18n="save"></button>
    <button class="bigbtn secondary" id="sleepBack" data-i18n="back"></button>
  </div>
</section>

<!-- REPORT -->
<section class="screen" id="scr-report">
  <div class="step-title" data-i18n="report_name"></div>
  <div class="card" id="reportBody" style="flex:1; overflow-y:auto;"></div>
  <div class="stack">
    <button class="bigbtn blue" id="shareBtn">💬 <span data-i18n="share"></span></button>
    <button class="bigbtn secondary" id="exportBtn">📤 <span data-i18n="export"></span></button>
    <button class="bigbtn secondary" id="reportBack" data-i18n="back"></button>
  </div>
</section>

<!-- ASSESSMENT SUMMARY -->
<section class="screen" id="scr-assess">
  <div class="step-title" data-i18n="assess_name"></div>
  <div class="card" id="assessList"></div>
  <div class="result-msg" id="assessMsg"></div>
  <div class="stack">
    <button class="bigbtn blue" id="assessShare">📤 <span data-i18n="share"></span></button>
    <button class="bigbtn green" id="assessDone" data-i18n="done"></button>
  </div>
</section>

<!-- SOS -->
<section class="screen" id="scr-sos">
  <div class="step-title" data-i18n="sos_name"></div>
  <div class="illus"><span class="em">🆘</span></div>
  <div class="step-sub" data-i18n="sos_text"></div>
  <div class="stack">
    <a href="tel:112" class="bigbtn" style="text-decoration:none;">📞 <span data-i18n="sos_call"></span></a>
    <button class="bigbtn secondary" id="sosBack" data-i18n="back"></button>
  </div>
</section>

<video id="video" autoplay playsinline muted></video>
<script src="app.js"></script>
</body>
</html>
